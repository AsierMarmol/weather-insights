[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-app"
version = "0.1.0"
description = "Group capstone: weather analytics app built on the OpenWeatherMap API."
requires-python = ">=3.11"
dependencies = [
    "requests",
    "python-dotenv",
    "streamlit",
    "pandas",
    "plotly",
]

[dependency-groups]
dev = [
    "flake8>=7.5.0",
    "pyright==1.1.414",
    "pytest>=9.2.0",
]

[tool.pyright]
include = ["app.py", "src", "scripts", "tests"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
executionEnvironments = [{ root = ".", extraPaths = ["src", "tests"] }]
